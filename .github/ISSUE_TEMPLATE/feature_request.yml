name: Feature request
description: Suggest something new
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Would you like to build it?
      options:
        - Yes
        - Yes, with some guidance
        - No
